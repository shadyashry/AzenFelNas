[project]
name = "dm_lab"
version = "0.1.0"
description = "Accuracy Lab: Skyfield/de440s reference harness and engine benchmark runner (DESIGN.md §9.4)."
requires-python = "==3.15.*"
dependencies = [
    "jplephem==2.24",
    "numpy==2.5.4",
    "pydantic==2.14.1",
    "skyfield==1.55",
    "tzdata==2026.5",
]

[project.scripts]
lab = "dm_lab.cli:main"

[dependency-groups]
dev = [
  "hypothesis==6.170.5",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.4"

[tool.ruff]
target-version = "py315"
line-length = 100
# Generated by scripts/gen_models.sh from schemas/ (ADR-023): neither linted nor format-checked.
# gen_models.sh formats them by naming the files, which bypasses this exclusion.
extend-exclude = ["src/dm_lab/schema/*_v1.py"]

[tool.ruff.format]
line-ending = "lf" # the repository is LF (.gitattributes); also normalises generated models on Windows.

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",   # conflicts with D211 (no blank line before class docstring); D211 wins.
  "D213",   # conflicts with D212 (summary on first line); D212 wins.
  "COM812", # conflicts with the ruff formatter.
  "CPY001", # no per-file copyright headers; licensing is repository-level (LICENSES.md).
  "TC001",  # type-only imports stay at runtime: pydantic resolves annotations when a model is built,
  "TC002",  # and Python 3.15 evaluates annotations lazily (PEP 649), so TYPE_CHECKING blocks or
  "TC003",  # `lazy` imports would buy nothing.
]
# DESIGN.md writes signs and segment bounds as − (U+2212), T₀, A₋, A₊; docstrings quote it as written.
allowed-confusables = ["−", "₋", "₊", "₀", "′", "–", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # pytest uses bare assert.
  "PLR2004", # expected values in assertions are the point of a test.
  "D401",    # fixture docstrings name the value the fixture provides.
]

[tool.mypy]
strict = true
python_version = "3.15"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# Skyfield, jplephem and tzdata ship no type information; dm_lab.sky and dm_lab.tzdb are the only
# importers and convert every value they return to a typed one.
module = ["skyfield.*", "jplephem.*", "tzdata"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = [
  "error",
  # skyfield 1.55 searchlib sets ndarray.dtype, deprecated in NumPy 2.5; harmless until Skyfield updates.
  "ignore:Setting the dtype on a NumPy array has been deprecated:DeprecationWarning:skyfield.searchlib",
]
