# Wire models follow schemas/*.schema.json (ADR-023): unknown keys are rejected and optional fields are
# written as null exactly where Appendix A has nullable members (§15 D21); optional rule
# parameters opt out per field.
targets:
  $default:
    builders:
      json_serializable:
        options:
          checked: true
          disallow_unrecognized_keys: true
          explicit_to_json: true
