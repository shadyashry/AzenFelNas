name: dm_ui
description: "Design system: tokens, SkyTheme and RTL-aware components (DESIGN.md §7.9, ADR-018)."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  geo_salah_core: 0.4.0
  meta: 1.19.0

dev_dependencies:
  dm_lints: 0.1.0
  flutter_test:
    sdk: flutter

# Bundled OFL faces (§7.9, §15 D109), each from the official google/fonts
# repository with its licence beside it in fonts/: Inter and Noto Sans Arabic
# for interface text, Lora and Noto Naskh Arabic for display text (prayer
# names, times, headings). Every file is a variable font; it is declared once
# per weight it serves so a requested weight matches a real face (never a
# synthesized bold), and DmTheme sets the matching `wght` axis.
flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Variable.ttf
          weight: 400
        - asset: fonts/Inter-Variable.ttf
          weight: 500
        - asset: fonts/Inter-Variable.ttf
          weight: 600
        - asset: fonts/Inter-Variable.ttf
          weight: 700
    - family: Noto Sans Arabic
      fonts:
        - asset: fonts/NotoSansArabic-Variable.ttf
          weight: 400
        - asset: fonts/NotoSansArabic-Variable.ttf
          weight: 500
        - asset: fonts/NotoSansArabic-Variable.ttf
          weight: 600
        - asset: fonts/NotoSansArabic-Variable.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: fonts/Lora-Variable.ttf
          weight: 400
        - asset: fonts/Lora-Variable.ttf
          weight: 500
        - asset: fonts/Lora-Variable.ttf
          weight: 600
        - asset: fonts/Lora-Variable.ttf
          weight: 700
    - family: Noto Naskh Arabic
      fonts:
        - asset: fonts/NotoNaskhArabic-Variable.ttf
          weight: 400
        - asset: fonts/NotoNaskhArabic-Variable.ttf
          weight: 500
        - asset: fonts/NotoNaskhArabic-Variable.ttf
          weight: 600
        - asset: fonts/NotoNaskhArabic-Variable.ttf
          weight: 700
