# Wire models follow schemas/*.schema.json (ADR-023): unknown keys are rejected and optional fields are
# omitted rather than written as null (§15 D21). The prayer_profile.v1 models (lib/src/wire/profile/)
# write Appendix A's nullable members as null with a per-field @JsonKey(includeIfNull: true).
targets:
  $default:
    builders:
      json_serializable:
        options:
          checked: true
          disallow_unrecognized_keys: true
          explicit_to_json: true
          include_if_null: false
