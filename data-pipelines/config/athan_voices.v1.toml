# Pinned sources of the downloadable Athan voices (DESIGN.md §9.5, §15 D111).
# `dm-pipelines athan-voices fetch` refuses (and deletes) bytes that do not match a sha256 below, and
# `dm-pipelines athan-voices build` refuses a source that does not, and output whose sha256 differs
# from `expectSha256` (a different ffmpeg can encode different bytes: rebuild, listen, re-pin here
# and in the app's `assets/athan/voice_catalog.json`).
#
# Processing is restricted to what the licence and the owner allow (§15 D111): the audio stream is
# copied out of its container unchanged (the "original"), then only leading silence is trimmed and
# one fixed gain brings it to -16 LUFS integrated; it is encoded AAC-LC to .m4a, the format the
# native player already plays. No splicing, pitch or tempo change, fades, denoising or limiting.
#
# Excluded candidates and why are recorded in DESIGN.md §15 D111, not here.

[[voice]]
soundId = "malmo_fajr_2012"
# The source names it a Fajr (dawn) Athan; the listening review that would confirm it is owed, so
# the app lists it on dev and lab only, and only as a Fajr voice.
designation = "fajr"
review = "pending"
version = 1
expectSha256 = "a51cd54c043cc5af7d669811245f91a0c7c90086865c608998a6adf44f8559dc"
ffmpeg = "9.0.2-full_build-www.gyan.dev"

[voice.source]
page = "https://commons.wikimedia.org/wiki/File:Eid_al-Fitr_Fajr_azan_at_Malm%C3%B6_Mosque_-_19_August_2012.webm"
url = "https://upload.wikimedia.org/wikipedia/commons/b/b1/Eid_al-Fitr_Fajr_azan_at_Malm%C3%B6_Mosque_-_19_August_2012.webm"
# Commons publishes the sha1 (bc75d5cee271efb67f03d3f35474a9362fce103f); the sha256 is of the same bytes.
sha256 = "899a3325aafb03e09381b3e40149e88d06b00b40ce2b1eeb09d63e594c9c1742"
retrieved = "2026-10-30"
# As the source states it: the author is the mosque's YouTube channel; the file page's title and
# description name "Besim Azemi" without saying he is the muezzin, so the app does not say so.
creator = "Islamic Center Malmö (YouTube channel “islamiccentermalmo”)"
origin = "https://www.youtube.com/watch?v=0IHfm4Y82xA"
uploader = "Rafic.Mufid (Wikimedia Commons, 2018-05-28, video2commons)"
recorded = "2012-08-19"
licence = "CC-BY-3.0"
licenceUrl = "https://creativecommons.org/licenses/by/3.0/"
# Commons' {{YouTubeReview}} confirmed the YouTube licence; archived 2020-02-12.
licenceReview = "https://web.archive.org/web/20200212214614/https://www.youtube.com/watch?v=0IHfm4Y82xA"
originalExtension = "opus"

[voice.processing]
# 0–4.5 s is room noise below -38 dB before the first sound; nothing after it is removed, and the
# recording's own end (during the final phrase's decay) is kept as published.
trimStartSeconds = 4.5
# Integrated loudness of the kept audio is -13.8 LUFS; -2.2 dB brings it to -16.0 LUFS.
gainDb = -2.2
targetLufs = -16.0
bitrateKbps = 96
