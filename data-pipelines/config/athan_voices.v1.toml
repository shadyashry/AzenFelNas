# archive.org publishes the sha1 (0d251a22a12ad47999032426c4846ce78c8db542); the sha256 is of the same bytes.
sha256 = "c0b18b25b1af6f4cb09503465c73b63f784178d2bea9c8856c469b012abd839f"
retrieved = "2026-10-30"
# "Called by: Asim Javed"; the same account publishes the centre's Friday khutbahs and prayers
