creator = "Asim Javed (the muezzin, who published it himself)"
origin = "https://archive.org/details/icr-friday-prayer-1st-adhan-17th-may-2024-9th-dhul-qadah-1445-by-asim-javed"
uploader = "Asim Javed (Internet Archive, 2024-05-18)"
recorded = "2024-05-17"
licence = "CC0-1.0"
licenceUrl = "https://creativecommons.org/publicdomain/zero/1.0/"
licenceReview = "https://archive.org/search?query=creator%3A%28%22Asim+Javed%22%29"
originalExtension = "wav"

[voice.processing]
# The first phrase starts 0.1 s into the file: nothing to trim.
