# Pinned IANA tz release for the `tzdata` package (DESIGN.md §9.5, §15 D66).
# `dm-pipelines tzdata build` refuses a source tree unless every file below has exactly this sha256;
# other files in the tree are ignored. The pins hold for the release tarball and for the git tag.
# A new release is a PR that changes this file and the committed outputs (runbook tzdb-emergency).

[release]
version = "2026e"
tarballUrl = "https://data.iana.org/time-zones/releases/tzdb-2026e.tar.lz"
gitUrl = "https://github.com/eggert/tz"
gitCommit = "039ef27cc5f062a2055cb67435d6d71adbefd27d"

[oracle]
# The DST transition suite (§13 S10): every benchmark-corpus zone, transitions in these years,
# and every civil day within windowDays of a transition.
cities = "lab/benchmarks/cities.v1.json"
fromYear = 2026
toYear = 2028
windowDays = 7

