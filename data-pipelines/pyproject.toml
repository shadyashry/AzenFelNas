[project]
name = "dm_pipelines"
version = "0.0.0"
description = "Data pipelines for tzdata, tz/country polygons, gazetteer and hijri packages (DESIGN.md §9.5)."
requires-python = "==3.15.*"
dependencies = [
    "pydantic==2.14.1",
]

[project.scripts]
dm-pipelines = "dm_pipelines.cli:main"

[dependency-groups]
dev = [
  "hypothesis==6.170.5",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.4"

[tool.ruff]
target-version = "py315"
line-length = 100
# Generated by scripts/gen_models.sh from schemas/ (ADR-023): neither linted nor format-checked.
extend-exclude = ["src/dm_pipelines/schema/*_v1.py"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",   # conflicts with D211 (no blank line before class docstring); D211 wins.
  "D213",   # conflicts with D212 (summary on first line); D212 wins.
  "COM812", # conflicts with the ruff formatter.
  "CPY001", # no per-file copyright headers; licensing is repository-level (LICENSES.md).
  "TC001",  # type-only imports stay at runtime: pydantic resolves annotations when a model is built,
  "TC002",  # and Python 3.15 evaluates annotations lazily (PEP 649), so TYPE_CHECKING blocks would
  "TC003",  # buy nothing (as in lab/).
]
allowed-confusables = ["−", "±"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # pytest uses bare assert.
  "PLR2004", # expected values in assertions are the point of a test.
  "D103",    # a test's name states the behaviour and the REQ it proves (DESIGN.md §17.7).
]

[tool.mypy]
strict = true
python_version = "3.15"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
