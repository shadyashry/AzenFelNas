# Package release (DESIGN.md §9.2, ADR-009, §15 D65/D85): pull the live channel from R2 (so sequences keep
# increasing across runs), gsctl build, sign every role with the dev keys of the chosen channel's environment,
# verify as a client would, publish to R2 (served at cdn.dailymuslim.app) and keep the signed repository as an
# artifact. dev and lab only: beta and production are reached by promote-package once the S27 keys exist.
# Environment secrets: DM_DEV_* keys, DM_S3_ACCESS_KEY_ID / DM_S3_SECRET_ACCESS_KEY (R2 token scoped to
# dm-dist object read/write); environment variable DM_S3_ENDPOINT (terraform output s3_endpoint).
name: release-package

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Target channel
        type: choice
        options: [dev, lab]
        required: true
      version:
        description: Package version (target prayer_profiles/<version>)
        type: string
        required: true
      effective_from:
        description: Date the release takes effect for all users, YYYY-MM-DD (REQ-GOV-004)
        type: string
        required: true
      note_ar:
        description: Change note, Arabic
        type: string
        required: true
      note_en:
        description: Change note, English
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: tools/gsctl/go.mod
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Profile semantics in geo_salah_profiles (parse, non-overlap, channel; §15 D61)
        run: |
          dart pub get
          cd packages/geo_salah_profiles && dart test
      - name: Build gsctl
        run: go build -o "$RUNNER_TEMP/gsctl" ./tools/gsctl
      - name: Pull, build, sign, verify and publish the channel to R2
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          EFFECTIVE_FROM: ${{ inputs.effective_from }}
          NOTE_AR: ${{ inputs.note_ar }}
          NOTE_EN: ${{ inputs.note_en }}
          DM_DEV_ROOT_KEY_1: ${{ secrets.DM_DEV_ROOT_KEY_1 }}
          DM_DEV_ROOT_KEY_2: ${{ secrets.DM_DEV_ROOT_KEY_2 }}
          DM_DEV_ROOT_KEY_3: ${{ secrets.DM_DEV_ROOT_KEY_3 }}
          DM_DEV_TARGETS_KEY_1: ${{ secrets.DM_DEV_TARGETS_KEY_1 }}
          DM_DEV_SNAPSHOT_KEY_1: ${{ secrets.DM_DEV_SNAPSHOT_KEY_1 }}
          DM_DEV_TIMESTAMP_KEY_1: ${{ secrets.DM_DEV_TIMESTAMP_KEY_1 }}
          DM_S3_ENDPOINT: ${{ vars.DM_S3_ENDPOINT }}
          DM_S3_ACCESS_KEY_ID: ${{ secrets.DM_S3_ACCESS_KEY_ID }}
          DM_S3_SECRET_ACCESS_KEY: ${{ secrets.DM_S3_SECRET_ACCESS_KEY }}
        run: |
          repo="$RUNNER_TEMP/channel/$CHANNEL"
          gsctl="$RUNNER_TEMP/gsctl"
          "$gsctl" pull -repo "$repo" -channel "$CHANNEL" -bucket s3://dm-dist
          "$gsctl" build -profiles profiles -channel "$CHANNEL" -repo "$repo" -version "$VERSION" \
            -effective-from "$EFFECTIVE_FROM" -note-ar "$NOTE_AR" -note-en "$NOTE_EN"
          # root is re-signed only on a first release or a key change; an unchanged root is not republished.
          test -f "$repo/metadata/root.json" || "$gsctl" sign -repo "$repo" -role root
          for role in targets snapshot timestamp; do
            "$gsctl" sign -repo "$repo" -role "$role"
          done
          "$gsctl" verify -repo "$repo"
          "$gsctl" publish -repo "$repo" -channel "$CHANNEL" -bucket s3://dm-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channel-${{ inputs.channel }}-${{ inputs.version }}
          path: ${{ runner.temp }}/channel
          if-no-files-found: error
