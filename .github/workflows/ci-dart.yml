# Dart + Flutter gate (DESIGN.md §12): format, strict analysis, arch lint, REQ index, tests.
# Also the secret scan (REQ-SEC-030).
name: ci-dart

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: dart pub get
      - name: Generated code is up to date (§15 D22)
        run: dart run melos run gen:check
      - name: melos run ci (format, analyze, arch lint, REQ index, tests)
        run: dart run melos run ci

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No private key material is tracked (REQ-SEC-030)
        run: |
          if git ls-files | grep -E '(^|/)private/|\.pem$|\.key$|\.jks$|\.keystore$'; then
            echo "::error::private key material is tracked"
            exit 1
          fi
      - name: gitleaks 8.30.1 (pinned binary, checksum verified)
        run: |
          curl -sSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --exit-code 1 .
