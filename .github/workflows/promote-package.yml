# Promotion (DESIGN.md §9.2, §15 D85): stage the reviewed targets (sequence N) of a published channel into the
# channel above it, unchanged (same bytes, hash and effectiveFrom, REQ-GOV-004), sign the destination's targets,
# snapshot and timestamp, verify and publish to R2. dev → lab only until the S27 production keys: lab → beta and
# beta → production then sign targets with `gsctl sign -kms` after google-github-actions/auth (OIDC, REQ-SEC-030)
# in the destination environment, whose required reviewers are the second person (dual control).
name: promote-package

on:
  workflow_dispatch:
    inputs:
      to:
        description: Destination channel (promoted from the channel below it)
        type: choice
        options: [lab]
        required: true
      sequence:
        description: Reviewed targets sequence of the source channel
        type: number
        required: true

permissions:
  contents: read

concurrency:
  group: release-package-${{ inputs.to }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.to }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: tools/gsctl/go.mod
      - name: Build gsctl
        run: go build -o "$RUNNER_TEMP/gsctl" ./tools/gsctl
      - name: Pull, promote, sign, verify and publish
        env:
          TO: ${{ inputs.to }}
          SEQUENCE: ${{ inputs.sequence }}
          DM_DEV_ROOT_KEY_1: ${{ secrets.DM_DEV_ROOT_KEY_1 }}
          DM_DEV_ROOT_KEY_2: ${{ secrets.DM_DEV_ROOT_KEY_2 }}
          DM_DEV_ROOT_KEY_3: ${{ secrets.DM_DEV_ROOT_KEY_3 }}
          DM_DEV_TARGETS_KEY_1: ${{ secrets.DM_DEV_TARGETS_KEY_1 }}
          DM_DEV_SNAPSHOT_KEY_1: ${{ secrets.DM_DEV_SNAPSHOT_KEY_1 }}
          DM_DEV_TIMESTAMP_KEY_1: ${{ secrets.DM_DEV_TIMESTAMP_KEY_1 }}
          DM_S3_ENDPOINT: ${{ vars.DM_S3_ENDPOINT }}
          DM_S3_ACCESS_KEY_ID: ${{ secrets.DM_S3_ACCESS_KEY_ID }}
          DM_S3_SECRET_ACCESS_KEY: ${{ secrets.DM_S3_SECRET_ACCESS_KEY }}
        run: |
          case "$TO" in lab) FROM=dev ;; *) echo "::error::unsupported destination $TO"; exit 1 ;; esac
          repo="$RUNNER_TEMP/channel/$TO"
          gsctl="$RUNNER_TEMP/gsctl"
          "$gsctl" pull -repo "$repo" -channel "$TO" -bucket s3://dm-dist
          "$gsctl" promote -repo "$repo" -from "$FROM" -to "$TO" -sequence "$SEQUENCE" -bucket s3://dm-dist
          test -f "$repo/metadata/root.json" || "$gsctl" sign -repo "$repo" -role root
          for role in targets snapshot timestamp; do
            "$gsctl" sign -repo "$repo" -role "$role"
          done
          "$gsctl" verify -repo "$repo"
          "$gsctl" publish -repo "$repo" -channel "$TO" -bucket s3://dm-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channel-${{ inputs.to }}-promoted-${{ inputs.sequence }}
          path: ${{ runner.temp }}/channel
          if-no-files-found: error
