# Go gate (DESIGN.md §17.5): golangci-lint (incl. gofumpt), go vet and go test -race for every module in go.work.
name: ci-go

on:
  pull_request:
    paths:
      - tools/gsctl/**
      - services/control-plane/**
      - schemas/**
      # gsctl's tests compile the seed profiles and compare them with the Dart bench copy (§15 D61).
      - profiles/**
      - packages/geo_salah_core/bench/profiles/**
      - go.work
      - .golangci.yml
      - .github/workflows/ci-go.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        module: [tools/gsctl, services/control-plane]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go test -race
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
