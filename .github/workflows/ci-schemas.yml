# Schema gate (DESIGN.md §12, ADR-023): metaschema check, valid/invalid fixtures and profiles/*/*.yaml with ajv-cli, Kaitai layouts compile.
# The four-language fixture round-trips run in ci-dart, ci-android, ci-ios and ci-go.
name: ci-schemas

on:
  pull_request:
    paths:
      - schemas/**
      - profiles/**
      - .github/workflows/ci-schemas.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schemas:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.4
      - name: Metaschema check (check-jsonschema 0.38.2)
        run: uvx check-jsonschema==0.38.2 --check-metaschema schemas/*.schema.json
      - name: Install pinned schema tools
        run: npm install --no-save --no-package-lock ajv-cli@5.0.0 ajv-formats@3.0.1 kaitai-struct-compiler@0.11.0 js-yaml@5.5.0
      - name: Fixtures (valid accepted, invalid rejected)
        run: AJV="$PWD/node_modules/.bin/ajv" schemas/tools/validate_fixtures.sh
      - name: Kaitai layouts compile
        run: node schemas/tools/check_ksy.cjs
