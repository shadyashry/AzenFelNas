# Profile gate (DESIGN.md §9.2, ADR-008, REQ-GOV-001..004): schema, non-overlap, compile, lab benchmark, holdout.
# S07 implemented the schema and non-overlap stages plus the seed conformance tests. S09 adds the compile stage
# (gsctl validate: profiles.json layout, governance and channel gates, §15 D60, D61) and the §9.2 rule that no PR
# changes an angle together with tz/coordinate data (gsctl check-change, §15 D64). The derivation-set lab benchmark
# and the holdout report do not exist yet, so the gate still fails closed for any profile that claims more than
# DRAFT_UNVERIFIED (§15 D52).
name: profiles-gate

on:
  pull_request:
    paths:
      - profiles/**
      - packages/geo_salah_profiles/**
      - tools/gsctl/**
      - schemas/prayer_profile.v1.schema.json
      - .github/workflows/profiles-gate.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the §9.2 change gate diffs against the merge base
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Install pinned schema tools
        run: npm install --no-save --no-package-lock ajv-cli@5.0.0 ajv-formats@3.0.1 js-yaml@5.5.0
      - name: Schema (Appendix A) for every profile
        run: |
          shopt -s nullglob
          profiles=(profiles/*/*.yaml)
          if [ ${#profiles[@]} -eq 0 ]; then echo "::error::no profiles"; exit 1; fi
          for f in "${profiles[@]}"; do
            node_modules/.bin/ajv validate --spec=draft2020 --strict=true --strict-types=false \
              --strict-required=false --allow-union-types -c ajv-formats --all-errors \
              -s schemas/prayer_profile.v1.schema.json -d "$f"
          done
      - name: Only DRAFT_UNVERIFIED until the benchmark and holdout stages exist (fail closed)
        run: |
          if grep -LE '^status: DRAFT_UNVERIFIED$' profiles/*/*.yaml | grep .; then
            echo "::error::a profile above DRAFT_UNVERIFIED needs the lab benchmark and a holdout report"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: tools/gsctl/go.mod
      - name: Compile profiles.json (gsctl validate, §15 D60, D61)
        run: go run ./tools/gsctl validate -profiles profiles -channel dev
      - name: No angle change together with tz/coordinate data (§9.2, gsctl check-change, §15 D64)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          merge_base="$(git merge-base "origin/$BASE_REF" HEAD)"
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$merge_base" profiles | tar -x -C "$RUNNER_TEMP/base"
          git diff --name-only "$merge_base" HEAD > "$RUNNER_TEMP/changed.txt"
          go run ./tools/gsctl check-change -base-profiles "$RUNNER_TEMP/base/profiles" -profiles profiles \
            -changed "$RUNNER_TEMP/changed.txt"
      - run: dart pub get
      - name: Parse, validate, non-overlap, channel and seed conformance (geo_salah_profiles)
        working-directory: packages/geo_salah_profiles
        run: dart test
