# Android gate (DESIGN.md §12, §17.3): ktlint, detekt, athan-core unit tests (fixture round-trips), debug APK.
name: ci-android

on:
  pull_request:
    paths:
      - apps/mobile/**
      - packages/dm_contracts/**
      - schemas/**
      - .github/workflows/ci-android.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.11+10.0.LTS
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: dart pub get
      - name: Build debug APK (generates the Gradle wrapper)
        working-directory: apps/mobile
        run: flutter build apk --debug
      - name: Merged manifest grants no advertising identifier (§12 security gate, REQ-PRIV-001)
        working-directory: apps/mobile
        run: |
          merged=$(find build/app/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
          test -n "$merged" || { echo "::error::no merged manifest found"; exit 1; }
          if grep -E 'permission\.(AD_ID|ACCESS_ADSERVICES_[A-Z_]+)"' "$merged" | grep -v 'tools:node="remove"'; then
            echo "::error::$merged grants an advertising-identifier permission"
            exit 1
          fi
      - name: Release APK builds and Room resolves to 2.7 or later (§15 D95)
        # Room 2.2.5's keep rule omits the database constructor, so an R8 full-mode release crashed at start while
        # every debug build ran; only the release build and the resolved version show it.
        working-directory: apps/mobile
        run: |
          flutter build apk --release --dart-define=DM_CHANNEL=lab
          deps=$(cd android && ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath)
          lowest=$(echo "$deps" | grep -oE 'androidx\.room:room-runtime:[0-9.]+( -> [0-9.]+)?' \
            | sed -E 's/.*[: ]([0-9.]+)$/\1/' | sort -uV | head -1)
          test -n "$lowest" || { echo "::error::room-runtime not found in the release classpath"; exit 1; }
          if [ "$(printf '%s\n' 2.7.0 "$lowest" | sort -V | head -1)" != 2.7.0 ]; then
            echo "::error::room-runtime resolves to $lowest; the release build crashes at start below 2.7"
            exit 1
          fi
      - name: ktlint 1.8.0 and detekt 1.23.8 (pinned, checksum verified)
        working-directory: apps/mobile/android
        run: |
          curl -sSLo ktlint.jar https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          echo "a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75  ktlint.jar" | sha256sum -c
          curl -sSLo detekt.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
          echo "2ce2ff952e150baf28a29cda70a363b0340b3e81a55f43e51ec5edffc3d066c1  detekt.jar" | sha256sum -c
          java -jar ktlint.jar "athan-core/src/**/*.kt" "athan-core/*.kts"
          java -jar detekt.jar --input athan-core/src --config config/detekt.yml --build-upon-default-config
      - name: athan-core unit tests
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon :athan-core:testDebugUnitTest
