# Android gate (DESIGN.md §12): debug APK plus the athan-core module with the §17.3 compiler bar.
# detekt, ktlint and the JUnit/Robolectric suites join in S21 with the first Kotlin source.
name: ci-android

on:
  pull_request:
    paths:
      - apps/mobile/**
      - packages/dm_contracts/**
      - .github/workflows/ci-android.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.11+10.0.LTS
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: dart pub get
      - name: Build debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug
      - name: Build athan-core
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon :athan-core:assembleDebug
