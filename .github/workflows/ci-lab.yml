# Python gate (DESIGN.md §17.6) for lab/ and data-pipelines/: ruff ALL, ruff format, mypy --strict, pytest.
# lab/ also checks that its pydantic models match schemas/ (ADR-023, §15 D27) and caches the pinned
# de440s.bsp ephemeris by its sha256 (§15 D28). Changes to the frozen reference need the
# `reference-update` label (ADR-019, §15 D25). data-pipelines/ also checks its generated models, and
# `tzdata-rebuild` reproduces the pinned tzdata payload, oracle and manifest byte for byte (§15 D66),
# the pinned tz/country polygon packages (§15 D70) and the gazetteer package (§15 D72).
name: ci-lab

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - lab/**
      - data-pipelines/**
      - packages/dm_civil_time/**
      - apps/mobile/assets/packages/**
      - schemas/**
      - .github/workflows/ci-lab.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        project: [lab, data-pipelines]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.4
      - run: uv sync --frozen
      - name: Generated models match schemas/
        run: bash scripts/gen_models.sh && git diff --exit-code -- src
      - name: Cache the pinned ephemeris (lab)
        if: matrix.project == 'lab'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lab/.cache
          key: de440s-c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src tests
      - run: uv run --frozen pytest

  tzdata-rebuild:
    # §15 D66: the pinned IANA release, rebuilt with its own zic and dm_civil_time's encoder,
    # reproduces packages/dm_civil_time/data/tzdata/<version>/ byte for byte.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: data-pipelines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: dart pub get
        working-directory: .
      - run: uv sync --frozen
      - run: uv run --frozen dm-pipelines tzdata fetch --dest "$RUNNER_TEMP/tz"
      - name: Rebuild matches the committed outputs
        env:
          DM_TZ_SOURCE: ${{ runner.temp }}/tz
        run: |
          uv run --frozen pytest -q -k rebuild | tee "$RUNNER_TEMP/rebuild.txt"
          grep -q "1 passed" "$RUNNER_TEMP/rebuild.txt"
      - name: Polygon packages rebuild byte for byte
        run: |
          mkdir -p "$RUNNER_TEMP/polygons"
          uv run --frozen dm-pipelines polygons fetch --dataset tz --dest "$RUNNER_TEMP/polygons/timezones.geojson.zip"
          uv run --frozen dm-pipelines polygons fetch --dataset country --dest "$RUNNER_TEMP/polygons/ne_10m_admin_0_map_units.geojson"
          DM_POLYGON_SOURCES="$RUNNER_TEMP/polygons" uv run --frozen pytest -q -k "rebuild and polygons" | tee "$RUNNER_TEMP/polygons.txt"
          grep -q "2 passed" "$RUNNER_TEMP/polygons.txt"
      - name: Gazetteer package rebuilds byte for byte
        run: |
          uv run --frozen dm-pipelines gazetteer fetch --dest "$RUNNER_TEMP/geonamescache.whl"
          DM_GAZETTEER_SOURCE="$RUNNER_TEMP/geonamescache.whl" uv run --frozen pytest -q -k "rebuild and gazetteer" | tee "$RUNNER_TEMP/gazetteer.txt"
          grep -q "1 passed" "$RUNNER_TEMP/gazetteer.txt"

  reference-freeze:
    # lab/reference/** is the frozen ADR-019 reference. Its manifest hashes the cities, the config, the
    # ephemeris pin and the reference-deciding lab code, and test_frozen_reference.py fails unless the
    # manifest matches them; so any change to those inputs also changes lab/reference/** and lands here.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Frozen reference changes carry the reference-update label
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'reference-update') }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- lab/reference)
          if [ -n "$changed" ] && [ "$HAS_LABEL" != "true" ]; then
            echo "::error::lab/reference changed without the reference-update label:"
            echo "$changed"
            exit 1
          fi
          echo "reference-freeze: ok (changed: ${changed:-none}, label: $HAS_LABEL)"
