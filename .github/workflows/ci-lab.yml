# Python gate (DESIGN.md §17.6) for lab/ and data-pipelines/: ruff ALL, ruff format, mypy --strict, pytest.
# lab/ also checks that its pydantic models match schemas/ (ADR-023, §15 D27) and caches the pinned
# de440s.bsp ephemeris by its sha256 (§15 D28).
name: ci-lab

on:
  pull_request:
    paths:
      - lab/**
      - data-pipelines/**
      - schemas/**
      - .github/workflows/ci-lab.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        project: [lab, data-pipelines]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.4
      - run: uv sync --frozen
      - name: Generated models match schemas/ (lab)
        if: matrix.project == 'lab'
        run: bash scripts/gen_models.sh && git diff --exit-code -- src/dm_lab/schema
      - name: Cache the pinned ephemeris (lab)
        if: matrix.project == 'lab'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lab/.cache
          key: de440s-c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src tests
      - run: uv run --frozen pytest
