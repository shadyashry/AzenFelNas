# detekt for athan-core (DESIGN.md §17.3): defaults plus the thresholds the design fixes.
# Disabling a rule needs a justification comment and a reviewer (§0.2 rule 11).
complexity:
  CyclomaticComplexMethod:
    threshold: 10
style:
  MaxLineLength:
    maxLineLength: 120

naming:
  FunctionNaming:
    # Compose (Glance) UI functions are nouns in PascalCase by convention (S28 widget, §15 D88).
    ignoreAnnotated:
      - Composable
