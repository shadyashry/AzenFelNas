name: daily_muslim
description: "Azen Fel Nas — offline-first prayer times, Athan and Qibla for iOS and Android (DESIGN.md §7)."
publish_to: none
version: 0.2.0+4
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  crypto: 3.0.7
  dm_civil_time: 0.1.0
  dm_contracts: 0.1.0
  dm_core_types: 0.1.0
  dm_hijri: 0.1.0
  dm_packages: 0.1.0
  dm_ui: 0.1.0
  drift: 2.35.2
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  geo_salah_core: 0.4.0
  geo_salah_profiles: 0.2.0
  geolocator: 14.1.1
  go_router: 18.1.1
  intl: 0.20.3
  json_annotation: 4.12.0
  meta: 1.19.0
  path_provider: 2.1.6
  permission_handler: 13.0.2
  permission_handler_platform_interface: 4.4.1
  sqlite3: 3.7.1

dev_dependencies:
  build_runner: 2.16.1
  dm_lints: 0.1.0
  drift_dev: 2.35.1
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/packages/seeds.json
    - assets/packages/gazetteer/3.0.2/gazetteer.json
    - assets/packages/prayer_profiles/2026.10.1/profiles.json
    - assets/packages/tzdata/2026e/tzdata.tzf
    - assets/packages/tz_polygons/2026e/tz_polygons.bin
    - assets/packages/country_polygons/5.1.2/country_polygons.bin
    - assets/legal/attributions.v1.json
    - assets/brand/
    - assets/art/
    - assets/athan/
    # The pinned Quran package (§15 D107), bundled so it installs with no
    # network (§15 D117). Not in git: `tool/bundle_quran.py` copies a
    # verified build here; without it the app downloads it from the CDN.
    - assets/quran/
    - assets/quran/pages/
    - assets/quran/fonts/
