targets:
  $default:
    builders:
      drift_dev:
        options:
          # `dart run drift_dev make-migrations` (§15 D76): one schema dump per
          # version under drift_schemas/, generated migration tests under test/drift/.
          databases:
            dm: lib/features/storage/data/dm_database.dart
            places: lib/features/storage/data/places_database.dart
            quran_notes: lib/features/quran/data/quran_notes_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
