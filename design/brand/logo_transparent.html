<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Amiri'; src:url(fonts/Amiri-Bold.ttf); font-weight:700; }
  @font-face { font-family:'Ruqaa'; src:url(fonts/ArefRuqaa-Bold.ttf); font-weight:700; }
  @font-face { font-family:'Inter'; src:url(../../packages/dm_ui/fonts/Inter-Variable.ttf); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { overflow:hidden; width:1000px; height:1100px; }
  body { width:1000px; height:1100px; background:transparent; position:relative; overflow:hidden; }
  svg.art { position:absolute; inset:0; }
  /* Padding gives the gradient room for every vowel mark and dot above and
     below the letters; background-clip paints only inside the box. */
  .w { position:absolute; white-space:nowrap; line-height:1; padding:.55em .12em; font-family:'Ruqaa'; font-weight:700;
       background:linear-gradient(180deg,#FBEFC4 0%,#E8C977 42%,#C29C4A 70%,#9C7731 100%);
       -webkit-background-clip:text; background-clip:text; color:transparent;
       filter:drop-shadow(0 2px 0 rgba(8,32,22,.55)) drop-shadow(0 0 18px rgba(255,236,170,.25)); }
  .latin { position:absolute; left:0; right:0; top:1028px; text-align:center; direction:ltr;
           font-family:'Inter'; font-size:26px; font-weight:600; letter-spacing:.42em; color:#8E6B2B; }
</style>
</head>
<body>
<svg class="art" viewBox="0 0 1000 1100">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E7B3"/><stop offset=".35" stop-color="#D9B76A"/>
      <stop offset=".65" stop-color="#A8823A"/><stop offset="1" stop-color="#EAD596"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E7B3"/><stop offset=".5" stop-color="#C29C4A"/><stop offset="1" stop-color="#8E6B2B"/>
    </linearGradient>
    <radialGradient id="niche" cx=".5" cy=".38" r=".75">
      <stop offset="0" stop-color="#23855C"/><stop offset=".55" stop-color="#15583D"/><stop offset="1" stop-color="#0B3324"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF1C2" stop-opacity=".55"/><stop offset="1" stop-color="#FFF1C2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="girih" width="56" height="56" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#EAD596" stroke-width=".8" opacity=".16">
        <rect x="16" y="16" width="24" height="24"/><rect x="16" y="16" width="24" height="24" transform="rotate(45 28 28)"/>
      </g>
    </pattern>
    <pattern id="girihPearl" width="56" height="56" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#C29C4A" stroke-width=".7" opacity=".14">
        <rect x="16" y="16" width="24" height="24"/><rect x="16" y="16" width="24" height="24" transform="rotate(45 28 28)"/>
      </g>
    </pattern>
    <clipPath id="nicheClip"><path d="M204 960 V440 C204 318 345 214 500 148 C655 214 796 318 796 440 V960 Z"/></clipPath>
    <symbol id="rosette" viewBox="-50 -50 100 100">
      <g fill="url(#gold)">
        <rect x="-30" y="-30" width="60" height="60"/><rect x="-30" y="-30" width="60" height="60" transform="rotate(45)"/>
      </g>
      <g fill="#145A3E"><rect x="-21" y="-21" width="42" height="42"/><rect x="-21" y="-21" width="42" height="42" transform="rotate(45)"/></g>
      <g fill="none" stroke="#EAD596" stroke-width="2.4"><rect x="-13" y="-13" width="26" height="26"/><rect x="-13" y="-13" width="26" height="26" transform="rotate(45)"/></g>
      <circle r="6" fill="url(#gold)"/>
    </symbol>
  </defs>

  <!-- Pearl ground with girih -->

  <!-- Alfiz: the gilded frame around the arch, with emerald spandrels -->
  <rect x="120" y="70" width="760" height="902" fill="#0E3B2A"/>
  <rect x="120" y="70" width="760" height="902" fill="url(#girih)"/>
  <rect x="120" y="70" width="760" height="902" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <rect x="136" y="86" width="728" height="870" fill="none" stroke="#EAD596" stroke-width="1.4" opacity=".85"/>
  <use href="#rosette" x="168" y="118" width="120" height="120"/>
  <use href="#rosette" x="712" y="118" width="120" height="120"/>

  <!-- Niche -->
  <path d="M204 960 V440 C204 318 345 214 500 148 C655 214 796 318 796 440 V960 Z" fill="url(#niche)"/>
  <g clip-path="url(#nicheClip)">
    <rect x="200" y="140" width="600" height="830" fill="url(#girih)"/>
    <ellipse cx="500" cy="640" rx="330" ry="300" fill="url(#glow)" opacity=".75"/>
    <ellipse cx="500" cy="300" rx="140" ry="120" fill="url(#glow)"/>
  </g>

  <!-- Arch rims: gilded outer, bead line, fine inner -->
  <path d="M182 960 V436 C182 306 333 196 500 124 C667 196 818 306 818 436 V960" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <path d="M204 960 V440 C204 318 345 214 500 148 C655 214 796 318 796 440 V960" fill="none" stroke="#EAD596" stroke-width="1.6"/>
  <path d="M220 960 V444 C220 328 352 228 500 166 C648 228 780 328 780 444 V960" fill="none" stroke="#EAD596" stroke-width="2.6" stroke-dasharray=".1 11" stroke-linecap="round" opacity=".85"/>

  <!-- Finial: an eight-point star on the apex -->
  <use href="#rosette" x="468" y="62" width="64" height="64"/>

  <!-- Columns with brass capitals and bases -->
  <g>
    <rect x="160" y="470" width="22" height="470" fill="url(#goldV)"/>
    <rect x="818" y="470" width="22" height="470" fill="url(#goldV)"/>
    <path d="M148 470 h46 l-8 -26 h-30 z" fill="url(#gold)"/><rect x="146" y="470" width="50" height="7" fill="#8E6B2B"/>
    <path d="M806 470 h46 l-8 -26 h-30 z" fill="url(#gold)"/><rect x="804" y="470" width="50" height="7" fill="#8E6B2B"/>
    <rect x="144" y="940" width="54" height="16" fill="url(#gold)"/>
    <rect x="802" y="940" width="54" height="16" fill="url(#gold)"/>
  </g>

  <!-- Hanging lamp (qandil) on its chain -->
  <g>
    <line x1="500" y1="150" x2="500" y2="214" stroke="#C29C4A" stroke-width="2.6"/>
    <circle cx="500" cy="262" r="78" fill="url(#glow)"/>
    <path d="M470 214 h60 l-8 18 h-44 z" fill="url(#gold)"/>
    <path d="M478 232 C456 256 450 276 468 296 L532 296 C550 276 544 256 522 232 Z" fill="#FBEFC4"/>
    <path d="M478 232 C456 256 450 276 468 296 L532 296 C550 276 544 256 522 232 Z" fill="none" stroke="#B8892E" stroke-width="2.4"/>
    <path d="M462 262 h76" stroke="#C29C4A" stroke-width="1.6"/>
    <circle cx="500" cy="264" r="6" fill="#E8C977"/>
    <rect x="482" y="296" width="36" height="9" rx="3" fill="url(#gold)"/>
    <path d="M492 305 l8 14 l8 -14 z" fill="url(#gold)"/>
  </g>

  <!-- Base rule with diamond terminals and a central star -->
  <line x1="150" y1="996" x2="470" y2="996" stroke="#C29C4A" stroke-width="2.4"/>
  <line x1="530" y1="996" x2="850" y2="996" stroke="#C29C4A" stroke-width="2.4"/>
  <rect x="134" y="988" width="16" height="16" transform="rotate(45 142 996)" fill="#C29C4A"/>
  <rect x="850" y="988" width="16" height="16" transform="rotate(45 858 996)" fill="#C29C4A"/>
  <use href="#rosette" x="478" y="974" width="44" height="44"/>
</svg>

<div class="words" style="position:absolute; inset:0; transform:translateY(34px) scale(1.12); transform-origin:500px 600px;">
<div class="w" style="top:347px; right:363px; font-size:188px;">أَذِّنْ</div>
<div class="w" style="top:422px; left:256px; font-size:132px;">فِي</div>
<div class="w" style="top:447px; right:236px; font-size:212px;">النَّاسِ</div>
</div>
<div class="latin">AZEN FEL NAS</div>
</body>
</html>
